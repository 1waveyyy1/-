<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Курьер App</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #1a1a1a 0%, #2d1b69 100%); /* Тёмный градиент как в Guna */
            color: white; 
            min-height: 100vh; 
            padding: 10px;
        }
        .container { max-width: 100%; margin: 0 auto; }
        .header { 
            background: linear-gradient(90deg, #dc3545, #ff0000); /* Красный градиент */
            border-radius: 10px; 
            padding: 15px; 
            margin-bottom: 15px; 
            box-shadow: 0 4px 15px rgba(220,53,69,0.5); /* Красная тень */
            text-align: center;
        }
        .header h2 { font-size: 1.4em; margin-bottom: 10px; }
        .input-group {
            display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 15px;
        }
        .input-field { 
            flex: 1; min-width: 120px;
            background: #2a2a2a; 
            border: 2px solid #dc3545; /* Красная рамка */
            border-radius: 8px; 
            padding: 12px; 
            color: white; 
            font-size: 1em;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.3);
        }
        .input-field:focus { 
            outline: none; 
            border-color: #ff0000; 
            box-shadow: 0 0 10px rgba(220,53,69,0.5);
        }
        .grids-container {
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;
        }
        .grid {
            background: #2a2a2a; 
            border: 2px solid #dc3545; /* Красная рамка как на скрине */
            border-radius: 10px; 
            min-height: 200px; 
            padding: 15px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            overflow-y: auto;
        }
        .grid h3 { margin-bottom: 10px; color: #ffdddd; }
        .order { 
            background: rgba(220,53,69,0.1); 
            border-left: 4px solid #ff0000; 
            padding: 10px; 
            margin-bottom: 10px; 
            border-radius: 5px;
        }
        #map { 
            height: 40vh; 
            border: 2px solid #dc3545; 
            border-radius: 10px; 
            box-shadow: 0 4px 15px rgba(220,53,69,0.3);
        }
        .btn {
            background: linear-gradient(45deg, #dc3545, #ff0000); /* Красный градиент кнопок */
            color: white; 
            border: none; 
            padding: 12px 20px; 
            border-radius: 25px; /* Скруглённые как Guna */
            font-size: 1em; 
            font-weight: bold;
            cursor: pointer; 
            box-shadow: 0 4px 15px rgba(220,53,69,0.4);
            transition: all 0.3s;
            min-width: 120px;
        }
        .btn:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 6px 20px rgba(220,53,69,0.6);
        }
        .btn:active { transform: translateY(0); }
        .status { background: rgba(255,0,0,0.2); padding: 8px; border-radius: 5px; margin-top: 10px; }
        @media (max-width: 600px) {
            .grids-container { grid-template-columns: 1fr; }
            .input-group { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Курьер #<span id="courierId">1</span></h2>
            <div class="status" id="status">Готов к заказам</div>
        </div>
        
        <div class="input-group">
            <input type="text" class="input-field" placeholder="№ заказа" id="orderNum">
            <input type="text" class="input-field" placeholder="Адрес" id="address">
            <input type="text" class="input-field" placeholder="Дата" id="date">
        </div>
        
        <div class="grids-container">
            <div class="grid">
                <h3>В работе</h3>
                <div id="activeOrders"></div>
            </div>
            <div class="grid">
                <h3>Завершённые</h3>
                <div id="completedOrders"></div>
            </div>
        </div>
        
        <div id="map"></div>
        
        <div style="text-align: center; margin-top: 15px;">
            <button class="btn" onclick="loadOrders()">Обновить</button>
            <button class="btn" onclick="confirmAll()">Все завершены</button>
        </div>
    </div>
    
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
